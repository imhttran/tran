[package]
name = "api-contract-acceptance"
version = "0.1.0"
edition = "2021"

# Acceptance crate for RUST-008A. Drives the real Axum API binary against a
# dedicated database and a deterministic Ollama server. It contains no RAG
# logic and no mock API: every endpoint is the production handler.

[lib]
path = "src/lib.rs"

[dependencies]
rag-foundation = { path = "../..", package = "rag-foundation" }
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
serde_json = "1.0"
